# Optional stateful agent. Existing API/Codex configurations keep their behavior.
env_cfg:
  env_path: "${AGENTARK_ENV_PATH}"
  mod_path: "${AGENTARK_MOD_PATH}"
  task_type: RLTask
  env_config_overrides:
    override_by_task: true
    num_parallel_envs: 1
  # The evaluator sets append_only + return_mode: delta only for SimpleAgent.

eval:
  output_path: tmp/simple_agent_results.jsonl
  # Record a failed case and continue the batch after recovery is exhausted.
  stop_on_error: false
  fixed_env_id: 0
  cases:
    - case_id: connection-seed-1
      task_name: ConnectionCounterplay2D
      group_seed: 1
  trajectory_save:
    enabled: true
    condition: all
    include_images: true
    output_path: tmp/simple_agent_trajectories.jsonl

models:
  - name: simple-qwen37-plus
    agent_type: simple
    provider: openrouter
    model: qwen/qwen3.7-plus
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.2
    # Reasoning shares the completion budget. Raise the output caps below
    # before selecting a more expensive reasoning profile.
    reasoning_effort: low
    max_completion_tokens: 20480
    max_retries: 0
    timeout_s: 1800
    simple_agent:
      # Native rounds can choose a host tool or the terminal submit_action.
      # Use auto for endpoints that do not support required tool selection.
      tool_choice: required
      # OpenRouter accepts max_tokens; other compatible endpoints may prefer
      # max_completion_tokens (the default).
      output_token_parameter: max_tokens
      context:
        # Total local estimate (256 * 1024), including the output reserve; not a model limit.
        max_context_tokens: 262144
        output_reserve_tokens: 20480
        recent_turns: 2
        max_images: 256
        max_context_characters: 524288
        max_summary_calls: 4
        summary_input_tokens: 48000
        summary_input_characters: 196608
        # API generation cap includes reasoning; memory keeps final content only.
        summary_output_tokens: 10000
        summary_output_characters: 32000
        summary_output_bytes: 128000
        max_archive_bytes: 536870912
        max_archive_image_bytes: 536870912
        max_archive_characters: 33554432
        timeout_seconds: 1800
      tools:
        enabled: true
        # Run this example from the Python repository so tmp/ is Git-ignored.
        workspace_parent: tmp/simple_agent_workspaces
        limits:
          max_records: 512
          max_published_bytes: 536870912
          max_calls: 32
          max_model_rounds: 16
          timeout_seconds: 1800
