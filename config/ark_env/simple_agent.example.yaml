# Recommended stateful evaluation harness. Existing API/Codex configurations keep their behavior.
env_cfg:
  env_path: "${AGENTARK_ENV_PATH}"
  mod_path: "${AGENTARK_MOD_PATH}"
  task_type: RLTask
  env_config_overrides:
    override_by_task: true
    num_parallel_envs: 1
    # Optional common prompt recipe: legacy_think (default) or brief_rationale.
    # The latter uses a short public explanation without an explanation tag.
    # SimpleAgent places it in assistant content and submits via submit_action.
    # prompt:
    #   explanation_mode: brief_rationale
  # The evaluator sets append_only + return_mode: delta only for SimpleAgent.

eval:
  output_path: tmp/simple_agent_results.jsonl
  # Record a failed case and continue the batch after recovery is exhausted.
  stop_on_error: false
  fixed_env_id: 0
  cases:
    - case_id: connection-seed-1
      task_name: ConnectionCounterplay2D
      group_seed: 1
  trajectory_save:
    enabled: true
    condition: all
    include_images: true
    # Optional audit fields are separate from restored history. Default true.
    include_agent_trace: true
    output_path: tmp/simple_agent_trajectories.jsonl

models:
  - name: simple-qwen37-plus
    # agent_type options (harness); provider selects the model backend:
    # simple: SimpleAgent, recommended; context compaction and optional host tools
    #         over HTTP or the Codex SDK.
    # api: APIAgent, the legacy stateless HTTP harness.
    # codex: CodexAgent, the SDK harness (use provider: codex).
    # Omitted: provider: codex selects CodexAgent; HTTP providers select APIAgent.
    # Keep the simple_agent settings below only when agent_type is simple.
    agent_type: simple
    provider: openrouter
    model: qwen/qwen3.7-plus
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.2
    # Reasoning shares the completion budget. Raise the output caps below
    # before selecting a more expensive reasoning profile.
    reasoning_effort: low
    max_completion_tokens: 20480
    max_retries: 0
    timeout_s: 1800
    simple_agent:
      # Native rounds can choose a host tool or the terminal submit_action.
      # Use auto for endpoints that do not support required tool selection.
      tool_choice: required
      # OpenRouter accepts max_tokens; other compatible endpoints may prefer
      # max_completion_tokens (the default).
      output_token_parameter: max_tokens
      context:
        # message_chunks_v1: bounded message chunks; whole_turn_v1: legacy behavior.
        compaction_policy: message_chunks_v1
        # Total local estimate (256 * 1024), including the output reserve; not a model limit.
        max_context_tokens: 262144
        output_reserve_tokens: 20480
        recent_turns: 2
        max_images: 256
        max_context_characters: 524288
        # Encoded messages include base64 images; leave room for the API envelope.
        max_context_bytes: 16000000
        max_summary_calls: 4
        summary_input_tokens: 48000
        summary_input_characters: 196608
        summary_input_bytes: 16000000
        # Independent API cap includes reasoning; inherits the action effort.
        # The action max_completion_tokens does not reduce this summary cap.
        # Memory keeps final content only.
        summary_output_tokens: 32768
        summary_output_characters: 32000
        summary_output_bytes: 128000
        max_archive_bytes: 536870912
        max_archive_image_bytes: 536870912
        max_archive_characters: 33554432
        timeout_seconds: 1800
      tools:
        enabled: true
        # Run this example from the Python repository so tmp/ is Git-ignored.
        workspace_parent: tmp/simple_agent_workspaces
        limits:
          max_records: 512
          max_published_bytes: 536870912
          max_calls: 32
          max_model_rounds: 16
          timeout_seconds: 1800
