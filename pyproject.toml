[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ark"
version = "0.1.0"
description = "An open-ended training and evaluation environment for multimodal agents"
authors = [
    { name = "P90-RushB" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "PyYAML>=6.0.1",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "requests>=2.31.0",
    "openai>=1.30.0",
    "numpy>=1.23.5,<1.24.0",
    "Pillow>=10.0.0",
    "mlagents_envs==1.1.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
]
readme = "README.md"
requires-python = ">=3.10,<3.10.13"

[project.optional-dependencies]
litellm = [
    # The pinned SDK imports MCP for tool requests and tenacity for retries.
    # tenacity is a runtime import absent from LiteLLM's dependency metadata.
    "litellm[mcp]==1.106.6",
    "tenacity==9.1.2",
]
codex = [
    "openai-codex>=0.147.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_ark = [
    "ark_env/info/system_prompt.txt",
    "ark_env/info/system_prompt_func.txt",
    "ark_env/info/system_prompt_func_zh.txt",
    "ark_env/info/system_prompt_code.txt",
    "ark_env/info/system_prompt_brief_rationale.txt",
    "ark_env/info/system_prompt_func_brief_rationale.txt",
    "ark_env/info/system_prompt_code_brief_rationale.txt",
    "agent/simple_agent/info/*.txt",
    "ark_eval/human_review_assets/*",
]
